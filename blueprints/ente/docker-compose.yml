version: "3.8"
services:
  ente:
    image: ghcr.io/ente-io/server:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../files/museum.yaml:/museum.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    expose:
      - "8080"

  # Resolve "localhost:3200" in the ente container to the minio container.
  socat:
    image: alpine/socat
    restart: always
    network_mode: service:ente
    depends_on:
      - ente
    command: "TCP-LISTEN:3200,fork,reuseaddr TCP:minio:3200"

  web:
    image: ghcr.io/ente-io/web:latest
    restart: always
    environment:
      - ENTE_API_ORIGIN=https://${ENTE_API_HOST}
    expose:
      - "3000"

  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=pguser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ente_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ente_db -U pguser"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --address ":3200" --console-address ":3201"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:3200 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do echo 'Waiting for MinIO...'; sleep 1; done;
      mc mb -p local/b2-eu-cen;
      mc mb -p local/wasabi-eu-central-2-v3;
      mc mb -p local/scw-eu-fr-v3;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
